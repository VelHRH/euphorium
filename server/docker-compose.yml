  database:
    container_name: database
    image: database_image
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    env_file:
      - .env
    environment:
      POSTGRES_DB: newblood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - 5433:5432
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres: {}
